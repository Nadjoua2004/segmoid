<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AstroDoc AI – dev panel</title>
<style>
  :root { --bg:#0b1020; --panel:#121933; --line:#24305a; --text:#e6ebff; --muted:#93a0c8;
          --nom:#22c55e; --warn:#eab308; --crit:#ef4444; --accent:#60a5fa; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui, Segoe UI, sans-serif; }
  header { display:flex; gap:12px; align-items:center; flex-wrap:wrap; padding:12px 16px; border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; margin:0 12px 0 0; letter-spacing:.04em; }
  select, input, button { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font:inherit; }
  button { cursor:pointer; } button:hover { border-color:var(--accent); }
  .badge { padding:4px 10px; border-radius:999px; font-weight:600; font-size:13px; }
  .Nominal { background:color-mix(in srgb, var(--nom) 20%, transparent); color:var(--nom); }
  .Warning { background:color-mix(in srgb, var(--warn) 20%, transparent); color:var(--warn); }
  .Critical { background:color-mix(in srgb, var(--crit) 22%, transparent); color:var(--crit); }
  main { max-width:860px; margin:0 auto; padding:16px; }
  #log { display:flex; flex-direction:column; gap:12px; min-height:50vh; }
  .msg { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 14px; white-space:pre-wrap; }
  .me { align-self:flex-end; background:#1b2a55; max-width:80%; }
  .meta { color:var(--muted); font-size:12px; margin-bottom:6px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .chip { display:inline-block; font-size:12px; padding:2px 8px; border-radius:999px; background:#16324a; color:#9fd3ff; margin:6px 6px 0 0; }
  .redflag { border-color:var(--crit); box-shadow:0 0 0 1px var(--crit) inset; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:8px; margin-top:10px; white-space:normal; }
  .card { border:1px solid var(--line); border-radius:10px; padding:8px 10px; background:#0e1530; }
  .card h4 { margin:0 0 4px; font-size:13px; } .card ol { margin:0; padding-left:18px; font-size:13px; }
  .card .src { color:var(--muted); font-size:11px; margin-top:4px; }
  .grp { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--accent); }
  .cites { margin-top:8px; font-size:12px; color:var(--muted); white-space:normal; }
  .cites a { color:var(--accent); }
  .actions button { margin:8px 8px 0 0; } .actions .danger { border-color:var(--crit); color:#ffb4b4; }
  form { display:flex; gap:8px; margin-top:16px; position:sticky; bottom:0; background:var(--bg); padding:10px 0; }
  form input { flex:1; }
  .notice { color:var(--warn); font-size:12px; }
  #mic.rec { border-color:var(--crit); color:#ffb4b4; animation:pulse 1s infinite; }
  @keyframes pulse { 50% { opacity:.55; } }
  @media (max-width:600px){ header{gap:8px} .me{max-width:95%} }
</style>
</head>
<body>
<header>
  <h1>ASTRODOC AI · dev panel</h1>
  <select id="astro"></select>
  <label>Day <select id="day"><option>12</option><option selected>47</option><option>120</option><option>121</option></select></label>
  <span id="level" class="badge">…</span>
  <label><input type="checkbox" id="offline"> offline mode</label>
  <label><input type="checkbox" id="speak"> read aloud</label>
  <span id="status" class="meta"></span>
</header>
<main>
  <div id="log"></div>
  <form id="f">
    <input id="q" placeholder="Ask AstroDoc… e.g. Can I still do the EVA tomorrow?" autocomplete="off">
    <button type="button" id="mic" title="Speak">🎤</button>
    <button>Send</button>
  </form>
</main>
<script>
const $ = s => document.querySelector(s);
let history = [];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function api(path, body) {
  const r = await fetch(path, body ? {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)} : {});
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

function render(res, isGreeting) {
  const el = document.createElement('div');
  el.className = 'msg' + (res.red_flag ? ' redflag' : '');
  let html = `<div class="meta"><span class="badge ${res.level}">${res.level || ''}</span><span>${res.mode}${isGreeting ? ' · auto-opened' : ''}</span>`
           + (res.red_flag ? `<span class="badge Critical">RED FLAG: ${esc(res.red_flag.label)}</span>` : '')
           + (res.crew_alert_triggered ? `<span class="badge Critical">Crew alerted</span>` : '') + `</div>`;
  html += esc(res.reply);
  if (res.notice) html += `<div class="notice">${esc(res.notice)}</div>`;
  html += (res.logged || []).map(l => `<span class="chip">${esc(l.label)}</span>`).join('');
  const groups = res.countermeasures || {};
  const cards = ['protocol','diet','shielding'].flatMap(g => (groups[g] || []).map(c => ({...c, g})));
  if (cards.length) html += `<div class="cards">` + cards.map(c => `<div class="card"><div class="grp">${c.g} · ${c.level}</div><h4>${esc(c.title)}</h4><ol>${c.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol><div class="src">${c.demo_protocol ? 'demo protocol · ' : ''}${c.source_url ? `<a href="${esc(c.source_url)}" target="_blank" rel="noopener">${esc(c.source_title)}</a>` : esc(c.source_title)}</div></div>`).join('') + `</div>`;
  if ((res.citations || []).length) html += `<div class="cites">Sources: ` + res.citations.map(c => `[${c.id}] ${c.url ? `<a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.title)}</a>` : esc(c.title)}${c.page ? ' p.' + c.page : ''}`).join(' · ') + `</div>`;
  if ((res.actions || []).length) html += `<div class="actions">` + res.actions.map(a => `<button class="${a.id === 'alert_crew' ? 'danger' : ''}" data-act="${a.id}">${esc(a.label)}</button>`).join('') + `</div>`;
  el.innerHTML = html;
  el.querySelectorAll('[data-act]').forEach(b => b.onclick = async () => {
    if (b.dataset.act === 'alert_crew') { const r = await api('/api/chat/alert-crew', {astronaut_id: $('#astro').value}); b.textContent = `Crew alerted → ${r.notified || 'CMO'}`; }
    else b.textContent = 'Acknowledged (handled by the alerts API)';
    b.disabled = true;
  });
  $('#log').appendChild(el); el.scrollIntoView({behavior:'smooth', block:'end'});
  if (res.level) { $('#level').className = 'badge ' + res.level; $('#level').textContent = res.level; }
  if ($('#speak').checked && 'speechSynthesis' in window) speechSynthesis.speak(new SpeechSynthesisUtterance(res.reply.replace(/\[S\d+\]/g, '')));
}

async function greet() {
  $('#log').innerHTML = ''; history = [];
  const res = await api('/api/chat/greet', {astronaut_id: $('#astro').value, offline: $('#offline').checked});
  render(res, true); history.push({role:'assistant', content: res.reply});
}

async function init() {
  const st = await api('/api/mock/state');
  $('#astro').innerHTML = st.crew.map(a => `<option value="${a.id}">${esc(a.name)} – ${esc(a.role)}</option>`).join('');
  const s = await api('/api/assistant/status');
  serverSTT = !!s.stt_available;
  $('#status').textContent = `LLM: ${s.llm_available ? s.model : 'offline'} · voice: ${serverSTT ? s.stt_model : 'browser'} · retriever: ${s.retriever} (${s.kb_chunks} chunks)`;
  await greet();
}

$('#astro').onchange = greet;
$('#day').onchange = async () => { await api('/api/mock/day', {day: +$('#day').value}); greet(); };
$('#f').onsubmit = async e => {
  e.preventDefault();
  const text = $('#q').value.trim(); if (!text) return;
  $('#q').value = '';
  const me = document.createElement('div'); me.className = 'msg me'; me.textContent = text; $('#log').appendChild(me);
  try {
    const res = await api('/api/chat', {astronaut_id: $('#astro').value, message: text, history, offline: $('#offline').checked});
    history.push({role:'user', content:text}, {role:'assistant', content: res.reply});
    render(res);
  } catch (err) { render({reply: 'Error: ' + err.message, mode: 'error'}); }
};
// ---- Voice: record -> POST /api/chat/voice (Whisper on the server) -> reply.
// Falls back to the browser's own speech recognition when server STT is unavailable.
let serverSTT = false, recorder = null, chunks = [], stopTimer = null;
const MAX_RECORD_MS = 30000;
const pickMime = () => ['audio/webm;codecs=opus', 'audio/ogg;codecs=opus', 'audio/webm', 'audio/mp4']
  .find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';

async function sendVoice(blob, ext) {
  const pending = document.createElement('div'); pending.className = 'msg me'; pending.textContent = '🎤 transcribing…';
  $('#log').appendChild(pending);
  const fd = new FormData();
  fd.append('audio', blob, 'speech.' + ext);
  fd.append('astronaut_id', $('#astro').value);
  fd.append('history', JSON.stringify(history));
  fd.append('offline', $('#offline').checked);
  try {
    const r = await fetch('/api/chat/voice', {method: 'POST', body: fd});
    const res = await r.json();
    if (!r.ok) throw new Error(res.detail || r.statusText);
    pending.textContent = '🎤 ' + res.transcript;
    history.push({role: 'user', content: res.transcript}, {role: 'assistant', content: res.reply});
    render(res);
  } catch (err) { pending.textContent = '🎤 (not understood)'; render({reply: 'Voice error: ' + err.message, mode: 'error'}); }
}

async function startRecording() {
  const stream = await navigator.mediaDevices.getUserMedia({audio: true});
  const mime = pickMime();
  recorder = new MediaRecorder(stream, mime ? {mimeType: mime} : undefined);
  chunks = [];
  recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
  recorder.onstop = () => {
    stream.getTracks().forEach(t => t.stop());
    clearTimeout(stopTimer);
    $('#mic').textContent = '🎤'; $('#mic').classList.remove('rec');
    const type = recorder.mimeType || 'audio/webm';
    const ext = type.includes('ogg') ? 'ogg' : type.includes('mp4') ? 'm4a' : 'webm';
    sendVoice(new Blob(chunks, {type}), ext);
    recorder = null;
  };
  recorder.start();
  $('#mic').textContent = '■ stop'; $('#mic').classList.add('rec');
  stopTimer = setTimeout(() => recorder && recorder.stop(), MAX_RECORD_MS);
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
$('#mic').onclick = async () => {
  if (recorder) return recorder.stop();
  if (serverSTT && navigator.mediaDevices && window.MediaRecorder) {
    try { return await startRecording(); }
    catch (e) { alert('Microphone unavailable: ' + e.message); return; }
  }
  if (!SR) return alert('Voice input needs server transcription or a browser with speech recognition (Chrome/Edge).');
  const r = new SR(); r.lang = 'en-US'; r.onresult = e => { $('#q').value = e.results[0][0].transcript; $('#f').requestSubmit(); }; r.start();
};
init().catch(e => render({reply: 'Failed to start: ' + e.message, mode: 'error'}));
</script>
</body>
</html>
